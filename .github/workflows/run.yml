name: 刷步数

on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  # 定时改由 cron-job.org 通过 workflow_dispatch 触发，不再用 GitHub 自带 schedule（常延迟）
  #schedule:
  #  - cron: '6 1,4,7,10,13 * * *'
  watch:
    types: started
  workflow_dispatch:
    inputs:
      random_delay:
        description: '触发后随机延迟0~59分钟再执行（cron-job.org 触发建议保持 true；手动测试可填 false）'
        default: 'true'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 随机延迟（错开提交时间）
        run: |
          if [ "${{ github.event.inputs.random_delay }}" != "false" ]; then
            D=$((RANDOM % 3540)); echo "随机延迟 ${D}s 后执行…"; sleep "$D"
          fi
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 开始
        env:
          TOKEN_CACHE_KEY: ${{ secrets.TOKEN_CACHE_KEY }}
        run: |
          pip3 install requests cryptography pysocks
          user='${{ secrets.USER }}'
          passwd='${{ secrets.PWD }}' 
          open_get_weather='${{ secrets.OPEN_GET_WEATHER }}'
          area='${{ secrets.AREA }}'
          appToken='${{ secrets.APPTOKEN }}'
          access='${{ secrets.ACCESS }}'
          uids='${{ secrets.UIDS }}'
          python3 main.py ${user} ${passwd} ${open_get_weather} ${area} ${appToken} ${access} ${uids}

      - name: 保存 token 缓存（加密后提交回仓库）
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain token_cache.bin)" ]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add token_cache.bin
            git commit -m "chore: update token cache"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "缓存 push 失败（可能有并发提交），本次忽略"
          else
            echo "token 缓存无变化，跳过提交"
          fi
